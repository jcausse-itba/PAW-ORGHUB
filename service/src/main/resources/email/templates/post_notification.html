<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva publicación</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
<div style="max-width: 600px; margin: 0 auto; padding: 20px;">
    <h1 style="color: #2c3e50;">¡Nueva publicación!</h1>
    <div style="margin: 20px 0;">
        <p><strong><span th:text="${organizationName}"/></strong> ha publicado algo nuevo:</p>
        <div style="background-color: #f0fdf4; padding: 20px; border-left: 4px solid #10b981; margin: 15px 0; border-radius: 5px;">
            <h3 style="color: #2c3e50; margin-top: 0;" th:text="${postTitle}"/>
            <p style="margin-bottom: 0;" th:text="${postBody}"/>
        </div>
        <p>¡No te pierdas esta actualización de una organización a la que te encuentras suscrito!</p>
    </div>
    <div style="text-align: center; margin: 40px 0;">
        <a th:href="${postUrl}"
           style="display: inline-block; padding: 12px 24px; background-color: #10b981; color: white; text-decoration: none; border-radius: 5px; font-weight: bold;">
            Ver publicación completa
        </a>
    </div>
    <div style="margin-top: 30px;">
        <p>Saludos!</p>
    </div>
</div>
</body>
</html>
