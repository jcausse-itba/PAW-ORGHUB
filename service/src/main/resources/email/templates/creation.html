<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>¡Bienvenido!</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
<div style="max-width: 600px; margin: 0 auto; padding: 20px;">
    <h1 style="color: #2c3e50;">¡Hola!</h1>
    <div style="margin: 20px 0;">
        <p>Te damos la bienvenida a nuestra plataforma. Tu organización "<span th:text="${organizationName}"/>" ha sido creada exitosamente.</p>
        <p>¡Esperamos que disfrutes usando nuestra plataforma para conectar con tu comunidad!</p>
    </div>
    <div style="text-align: center; margin: 40px 0;">
        <a th:href="${organizationUrl}"
           style="display: inline-block; padding: 12px 24px; background-color: #3498db; color: white; text-decoration: none; border-radius: 5px; font-weight: bold;">
            Ver mi organización
        </a>
    </div>
    <div style="margin-top: 30px;">
        <p>Saludos!</p>

    </div>
</div>
</body>
</html>
