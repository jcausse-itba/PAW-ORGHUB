<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo comentario</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
<div style="max-width: 600px; margin: 0 auto; padding: 20px;">
    <h1 style="color: #2c3e50;">¡Nuevo comentario!</h1>
    <div style="margin: 20px 0;">
        <p>Tu publicación "<span th:text="${postTitle}"/>" ha recibido un nuevo comentario:</p>
        <div style="background-color: #f0fdf4; padding: 15px; border-left: 4px solid #10b981; margin: 15px 0;">
            <p style="font-style: italic;" th:text="${commentContent}"/>
        </div>
        <p>¡Ingresa a la plataforma para ver más detalles!</p>
    </div>
    <div style="text-align: center; margin: 40px 0;">
        <a th:href="${commentUrl}"
           style="display: inline-block; padding: 12px 24px; background-color: #10b981; color: white; text-decoration: none; border-radius: 5px; font-weight: bold;">
            Ver comentario
        </a>
    </div>
    <div style="margin-top: 30px;">
        <p>Saludos!</p>
    </div>
</div>
</body>
</html>
